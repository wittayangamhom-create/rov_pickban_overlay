<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament - ROV Overlay Tool</title>
<!-- หน้านี้เสิร์ฟที่ /tournament/:id ซึ่งลึกกว่าหน้าอื่นหนึ่งชั้น
     ทุก path ของ css/js จึงต้องขึ้นต้นด้วย / เสมอ ห้ามใช้ path สัมพัทธ์ -->
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="topbar">
  <div class="logo">ROV <span>|</span> OVERLAY TOOL</div>
  <nav class="topnav" aria-label="Pages">
    <a class="tlink" href="/">HOME</a>
    <a class="tlink" href="/control">CONTROL</a>
    <a class="tlink" href="/presets">PRESETS</a>
    <a class="tlink" href="/design">DESIGN</a>
    <a class="tlink" href="/hotkeys">HOTKEYS</a>
  </nav>
</div>

<div class="wrap">

  <div class="section">
    <div class="section-head">
      <a class="tlink" href="/">&larr; ALL TOURNAMENTS</a>
      <div class="spacer"></div>
      <div class="status-tags" id="headBadges"></div>
    </div>
    <h1 class="tcard-name" id="headName" style="font-size:26px;letter-spacing:1.5px;"></h1>
  </div>

  <div class="section" id="detailSection" hidden>
    <div class="section-head">
      <div class="section-title">Tournament details</div>
    </div>
    <div class="panel">
      <div class="frow">
        <div class="fld">
          <label for="fName">Name</label>
          <input id="fName" type="text" maxlength="60" autocomplete="off">
        </div>
        <div class="fld">
          <label for="fFormat">Format</label>
          <select id="fFormat"></select>
          <span class="hint" id="formatHint"></span>
        </div>
        <div class="fld">
          <label for="fBestOf">Series length</label>
          <select id="fBestOf"></select>
        </div>
        <div class="fld">
          <label for="fStatus">Status</label>
          <select id="fStatus">
            <option value="active">Active</option>
            <option value="finished">Finished</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fld wide">
          <label for="fNote">Note</label>
          <textarea id="fNote" maxlength="500"></textarea>
        </div>
      </div>
      <div class="frow">
        <button type="button" class="tlink primary" id="saveBtn">SAVE CHANGES</button>
        <button type="button" class="tlink" id="revertBtn">REVERT</button>
        <div class="spacer"></div>
        <button type="button" class="tlink danger" id="deleteBtn">DELETE TOURNAMENT</button>
      </div>
    </div>
  </div>

  <div class="section" id="teamsSection" hidden>
    <div class="section-head">
      <div class="section-title">Teams</div>
      <div class="status-tags" id="teamBadges"></div>
      <div class="spacer"></div>
      <button type="button" class="tlink primary" id="addTeamBtn">+ ADD TEAM</button>
    </div>

    <div class="panel" id="addPanel" hidden>
      <div class="frow">
        <div class="fld">
          <label for="pickTeam">Add a team already in the registry</label>
          <select id="pickTeam"></select>
        </div>
        <div class="fld" style="flex:0 0 auto;justify-content:flex-end;">
          <button type="button" class="tlink primary" id="addExistingBtn">ADD TO TOURNAMENT</button>
        </div>
      </div>
      <div class="frow" style="border-top:1px solid var(--border);padding-top:12px;">
        <div class="fld">
          <label for="newTeamName">…or create a new team</label>
          <input id="newTeamName" type="text" maxlength="24" placeholder="Team name" autocomplete="off">
        </div>
        <div class="fld" style="flex:0 0 130px;">
          <label for="newTeamTag">Tag</label>
          <input id="newTeamTag" type="text" maxlength="6" placeholder="FW" autocomplete="off">
        </div>
        <div class="fld" style="flex:0 0 auto;justify-content:flex-end;">
          <button type="button" class="tlink primary" id="createTeamBtn">CREATE &amp; ADD</button>
        </div>
      </div>
      <div class="frow">
        <button type="button" class="tlink" id="closeAddBtn">CLOSE</button>
      </div>
    </div>

    <div id="teamsBody"></div>
  </div>

  <div class="section" id="matchesSection" hidden>
    <div class="section-head">
      <div class="section-title">Matches</div>
      <div class="status-tags" id="matchBadges"></div>
      <div class="spacer"></div>
      <label class="badge" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="randomiseDraw"> Random draw
      </label>
      <button type="button" class="tlink primary" id="drawBtn">DRAW MATCHES</button>
      <a class="tlink" id="bracketLink" href="#">BRACKET VIEW</a>
      <button type="button" class="tlink danger" id="clearMatchesBtn">CLEAR</button>
    </div>
    <div id="matchesBody"></div>
  </div>

  <div class="section" id="obsSection" hidden>
    <div class="section-head">
      <div class="section-title">OBS browser sources</div>
    </div>
    <div id="sources"></div>
  </div>

  <div class="foot" id="foot"></div>

</div>

<div class="toast" id="toast_el"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/lib/app-client.js"></script>
<script src="/js/tournament.js"></script>
</body>
</html>
